<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor Mart - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-20">

    <div class="w-full min-h-screen bg-white flex flex-col relative max-w-3xl mx-auto shadow-xl">
        
        <!-- Admin Header -->
        <header class="bg-purple-900 text-white p-4 sticky top-0 z-50 shadow-md">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="font-black text-sm">🛠️ MANOR MART ADMIN</h1>
                    <p class="text-[10px] text-purple-200">Store Management Panel</p>
                </div>
                <div id="store-status-badge" class="bg-green-600 px-3 py-1 rounded-full text-xs font-extrabold">
                    STORE OPEN
                </div>
            </div>

            <!-- Admin Navigation Tabs -->
            <div class="flex space-x-1 mt-3 border-t border-purple-800 pt-2">
                <button onclick="switchAdminTab('orders')" id="atab-orders" class="flex-1 py-1.5 rounded-lg bg-amber-400 text-purple-900 font-extrabold text-xs text-center shadow-sm">📦 Orders</button>
                <button onclick="switchAdminTab('products')" id="atab-products" class="flex-1 py-1.5 rounded-lg bg-purple-800 text-white font-extrabold text-xs text-center">🛒 Products</button>
                <button onclick="switchAdminTab('settings')" id="atab-settings" class="flex-1 py-1.5 rounded-lg bg-purple-800 text-white font-extrabold text-xs text-center">⚙️ Settings</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-3 pb-20 overflow-y-auto">
            
            <!-- ORDERS SECTION -->
            <div id="admin-orders" class="space-y-3">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-extrabold text-xs text-purple-900 uppercase tracking-wider">📦 Live Customer Orders</h2>
                    <button onclick="loadAdminOrders()" class="bg-purple-100 text-purple-900 px-2.5 py-1 rounded-lg text-xs font-bold">🔄 Refresh</button>
                </div>
                <div id="admin-orders-list" class="space-y-3">
                    <p class="text-center text-gray-400 text-xs py-10">Loading orders...</p>
                </div>
            </div>

            <!-- PRODUCTS SECTION -->
            <div id="admin-products" class="hidden space-y-4">
                <div class="bg-purple-50 p-3.5 rounded-2xl border border-purple-200 space-y-3 shadow-2xs">
                    <h3 class="font-extrabold text-xs text-purple-900 uppercase">➕ Add / Update Product</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-600">Category Name:</label>
                            <input type="text" id="p-cat" class="w-full p-2 bg-white border border-purple-200 rounded-xl text-xs outline-none" placeholder="e.g. Vegetables">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-600">Product Name:</label>
                            <input type="text" id="p-name" class="w-full p-2 bg-white border border-purple-200 rounded-xl text-xs outline-none" placeholder="e.g. Potato">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-600">Price (₹):</label>
                            <input type="number" id="p-price" class="w-full p-2 bg-white border border-purple-200 rounded-xl text-xs outline-none" placeholder="30">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-600">Discount (₹):</label>
                            <input type="number" id="p-disc" class="w-full p-2 bg-white border border-purple-200 rounded-xl text-xs outline-none" placeholder="5">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-600">Unit:</label>
                            <input type="text" id="p-unit" class="w-full p-2 bg-white border border-purple-200 rounded-xl text-xs outline-none" placeholder="1 kg">
                        </div>
                    </div>
                    <button onclick="saveProduct()" class="w-full bg-purple-900 text-white py-2.5 rounded-xl text-xs font-extrabold shadow-sm">Save Product to Database</button>
                </div>

                <div class="bg-white p-3.5 rounded-2xl border border-gray-200 shadow-2xs">
                    <h3 class="font-extrabold text-xs text-gray-900 uppercase mb-2">📋 Existing Store Catalog</h3>
                    <div id="admin-catalog-list" class="space-y-2">
                        <p class="text-xs text-gray-400">Loading catalog...</p>
                    </div>
                </div>
            </div>

            <!-- SETTINGS SECTION -->
            <div id="admin-settings" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-2xs space-y-3">
                    <h3 class="font-extrabold text-xs text-purple-900 uppercase">⚙️ Store Operations</h3>
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <div>
                            <p class="font-bold text-xs">Store Open / Close</p>
                            <p class="text-[10px] text-gray-500">Temporarily allow or stop incoming orders</p>
                        </div>
                        <button onclick="toggleStoreOpen()" id="store-toggle-btn" class="px-4 py-2 bg-green-600 text-white font-extrabold text-xs rounded-xl shadow-xs">OPEN</button>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-600">Delivery Radius Limit (KM):</label>
                        <input type="number" id="set-radius" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold mt-1 outline-none" placeholder="2">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-600">Announcement / Notice:</label>
                        <input type="text" id="set-announcement" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold mt-1 outline-none" placeholder="e.g. Fresh stock arrived today!">
                    </div>

                    <button onclick="saveStoreSettings()" class="w-full bg-purple-900 text-white py-3 rounded-xl text-xs font-extrabold shadow-md">Save Settings</button>
                </div>
            </div>

        </main>
    </div>

    <script>
        const DB_URL = "https://manormart-b14cd-default-rtdb.firebaseio.com/";
        let storeData = {};
        let currentAdminTab = 'orders';

        window.onload = () => {
            fetchAdminData();
            setInterval(fetchAdminData, 6000);
        };

        function fetchAdminData() {
            fetch(DB_URL + ".json")
                .then(res => res.json())
                .then(data => {
                    if (!data) return;
                    storeData = data;
                    if (currentAdminTab === 'orders') renderAdminOrders();
                    if (currentAdminTab === 'products') renderAdminCatalog();
                    if (data.settings) {
                        let isOpen = data.settings.storeOpen !== false;
                        let btn = document.getElementById('store-toggle-btn');
                        let badge = document.getElementById('store-status-badge');
                        if (isOpen) {
                            btn.innerText = "OPEN";
                            btn.className = "px-4 py-2 bg-green-600 text-white font-extrabold text-xs rounded-xl shadow-xs";
                            badge.innerText = "STORE OPEN";
                            badge.className = "bg-green-600 px-3 py-1 rounded-full text-xs font-extrabold text-white";
                        } else {
                            btn.innerText = "CLOSED";
                            btn.className = "px-4 py-2 bg-red-600 text-white font-extrabold text-xs rounded-xl shadow-xs";
                            badge.innerText = "STORE CLOSED";
                            badge.className = "bg-red-600 px-3 py-1 rounded-full text-xs font-extrabold text-white";
                        }
                        document.getElementById('set-radius').value = data.settings.radiusKm || 2;
                        document.getElementById('set-announcement').value = data.settings.adminNote || '';
                    }
                }).catch(e => console.log(e));
        }

        function switchAdminTab(tab) {
            currentAdminTab = tab;
            ['orders', 'products', 'settings'].forEach(t => {
                document.getElementById('admin-' + t)?.classList.add('hidden');
                document.getElementById('atab-' + t)?.classList.remove('bg-amber-400', 'text-purple-900', 'shadow-sm');
                document.getElementById('atab-' + t)?.classList.add('bg-purple-800', 'text-white');
            });
            document.getElementById('admin-' + tab)?.classList.remove('hidden');
            let activeBtn = document.getElementById('atab-' + tab);
            if (activeBtn) {
                activeBtn.classList.remove('bg-purple-800', 'text-white');
                activeBtn.classList.add('bg-amber-400', 'text-purple-900', 'shadow-sm');
            }

            if (tab === 'orders') renderAdminOrders();
            if (tab === 'products') renderAdminCatalog();
        }

        function renderAdminOrders() {
            let container = document.getElementById('admin-orders-list');
            container.innerHTML = '';
            let orders = storeData.orders || {};
            let keys = Object.keys(orders).reverse();

            if (keys.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-xs py-10">No orders received yet.</p>';
                return;
            }

            keys.forEach(k => {
                let ord = orders[k];
                let itemsList = Object.values(ord.items || {}).map(i => `• ${i.name} (${i.unit}) x ${i.qty}`).join('<br>');

                container.innerHTML += `
                    <div class="bg-white p-3.5 rounded-2xl border border-purple-200 shadow-2xs space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-extrabold text-purple-900 text-xs">ORDER #${ord.id.slice(-6)}</span>
                            <span class="font-extrabold text-green-700 text-xs">₹${ord.total} (${ord.payment})</span>
                        </div>
                        <p class="text-[11px] text-gray-700 font-medium">👤 <strong>${ord.name}</strong> (${ord.phone})</p>
                        <p class="text-[11px] text-gray-600">📍 ${ord.addr}</p>
                        <div class="bg-gray-50 p-2 rounded-xl text-[10px] text-gray-700">${itemsList}</div>
                        
                        <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                            <span class="text-[10px] font-bold text-purple-800">Status: ${ord.deliveryStatus}</span>
                            <div class="space-x-1">
                                <button onclick="updateOrderStatus('${ord.id}', 'Order Successful')" class="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold">Accept</button>
                                <button onclick="updateOrderStatus('${ord.id}', 'Out for Delivery')" class="bg-amber-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold">Dispatched</button>
                                <button onclick="updateOrderStatus('${ord.id}', 'Delivered')" class="bg-green-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold">Delivered</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateOrderStatus(orderId, status) {
            fetch(DB_URL + `orders/${orderId}/deliveryStatus.json`, {
                method: 'PUT',
                body: JSON.stringify(status)
            }).then(() => {
                alert("Order status updated to: " + status);
                fetchAdminData();
            });
        }

        function saveProduct() {
            let cat = document.getElementById('p-cat').value.trim();
            let name = document.getElementById('p-name').value.trim();
            let price = document.getElementById('p-price').value.trim();
            let disc = document.getElementById('p-disc').value || '0';
            let unit = document.getElementById('p-unit').value.trim();

            if (!cat || !name || !price || !unit) return alert("Please fill all product fields.");

            let pKey = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            let prodObj = { name, price: Number(price), discount: Number(disc), unit, inStock: true };

            fetch(DB_URL + `categories/${cat}/${pKey}.json`, {
                method: 'PUT',
                body: JSON.stringify(prodObj)
            }).then(() => {
                alert("Product saved successfully!");
                document.getElementById('p-name').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-disc').value = '';
                document.getElementById('p-unit').value = '';
                fetchAdminData();
            });
        }

        function renderAdminCatalog() {
            let container = document.getElementById('admin-catalog-list');
            container.innerHTML = '';
            let cats = storeData.categories || {};

            Object.keys(cats).forEach(cat => {
                container.innerHTML += `<p class="font-extrabold text-xs text-purple-900 mt-2">📁 ${cat}</p>`;
                let items = cats[cat];
                Object.keys(items).forEach(pKey => {
                    if (['status', 'image', 'discountPercent'].includes(pKey)) return;
                    let pr = items[pKey];
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-xl border border-gray-100 text-xs">
                            <span>${pr.name} (${pr.unit}) - ₹${pr.price}</span>
                            <button onclick="deleteProduct('${cat}', '${pKey}')" class="bg-red-50 text-red-600 px-2 py-0.5 rounded-lg text-[10px] font-bold">Delete</button>
                        </div>
                    `;
                });
            });
        }

        function deleteProduct(cat, pKey) {
            if (confirm("Are you sure you want to delete this product?")) {
                fetch(DB_URL + `categories/${cat}/${pKey}.json`, { method: 'DELETE' })
                    .then(() => {
                        alert("Product deleted!");
                        fetchAdminData();
                    });
            }
        }

        function toggleStoreOpen() {
            let currentOpen = storeData.settings?.storeOpen !== false;
            let newOpen = !currentOpen;
            fetch(DB_URL + `settings/storeOpen.json`, {
                method: 'PUT',
                body: JSON.stringify(newOpen)
            }).then(() => {
                fetchAdminData();
            });
        }

        function saveStoreSettings() {
            let radius = document.getElementById('set-radius').value;
            let note = document.getElementById('set-announcement').value;

            fetch(DB_URL + `settings.json`, {
                method: 'PATCH',
                body: JSON.stringify({ radiusKm: Number(radius) || 2, adminNote: note })
            }).then(() => {
                alert("Settings saved successfully!");
                fetchAdminData();
            });
        }
    </script>
</body>
</html>
